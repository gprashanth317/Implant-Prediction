<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ImplantAI Appium Android E2E Execution Report</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 30px; }
        h1 { color: #38bdf8; }
        .card-grid { display: flex; gap: 20px; margin-bottom: 30px; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; flex: 1; text-align: center; border: 1px solid #334155; }
        .card .val { font-size: 2rem; font-weight: bold; margin-top: 5px; }
        .pass { color: #22c55e; }
        .fail { color: #ef4444; }
    </style>
</head>
<body>
    <h1>ImplantAI Appium Android E2E Execution Report</h1>
    <div class="card-grid">
        <div class="card"><div>Total Tests</div><div class="val">1</div></div>
        <div class="card"><div>Passed</div><div class="val pass">0</div></div>
        <div class="card"><div>Failed</div><div class="val fail">1</div></div>
        <div class="card"><div>Pass Rate</div><div class="val pass">0.0%</div></div>
        <div class="card"><div>Total Duration</div><div class="val">15 ms</div></div>
    </div>
</body>
</html>
