name: Build Android APK Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Native Android APK with Gradle
        run: |
          cd android_app
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy Built APK Artifact
        run: |
          mkdir -p dist_apk
          cp android_app/app/build/outputs/apk/debug/app-debug.apk dist_apk/ImplantAI.apk

      - name: Upload Native Android APK Artifact (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: ImplantAI-Android-APK
          path: dist_apk/ImplantAI.apk
