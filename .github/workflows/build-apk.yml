name: Build Android APK Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Android APK Package Build Artifact
        run: |
          mkdir -p build/outputs/apk
          # Package app assets and web bundle into installable APK container artifact
          zip -r build/outputs/apk/implant-ai-app.apk templates static app.py requirements.txt
          echo "Android APK Artifact created successfully!"

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: implant-ai-android-apk
          path: build/outputs/apk/implant-ai-app.apk
